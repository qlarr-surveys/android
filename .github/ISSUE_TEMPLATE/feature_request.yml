---
name: Feature request
description: Suggest a new feature or improvement
title: '[Feature] '
labels:
  - enhancement

body:
  - type: dropdown
    id: category
    attributes:
      label: Feature category
      options:
        - User interface
        - Offline sync
        - Survey functionality
        - Performance
        - Accessibility
        - Other
    validations:
      required: true
  - type: textarea
    id: usecase
    attributes:
      label: Use case
      description: Describe the problem this feature would solve
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should this feature work?
    validations:
      required: true
  - type: textarea
    id: mockups
    attributes:
      label: Mockups / Design suggestions
      description: Any visual ideas or references?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you've considered?